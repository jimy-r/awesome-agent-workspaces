name: Link check

# Two modes:
#   - On pull_request: check only the .md files the PR actually changed.
#     Whole-repo checks on every PR punish contributors for link rot they did
#     not introduce. Diff-only scopes failure to the author's diff.
#   - On schedule / workflow_dispatch: full-repo sweep. A curated list dies of
#     link rot, so the weekly pass is the one that matters here. Failure opens
#     an Issue so the maintainer triages on a weekly rhythm.

on:
  pull_request:
    paths:
      - '**/*.md'
  schedule:
    - cron: '0 6 * * 1' # Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  lychee:
    runs-on: ubuntu-latest
    env:
      # One title for the standing issue. The lookup below matches on it and
      # create-issue-from-file writes it, so the two must not drift apart.
      ISSUE_TITLE: 'Link check failed (scheduled run)'
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so we can diff the PR head against base.
          fetch-depth: 0

      - name: Get changed markdown files (PR only)
        id: changed
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          files=$(git diff --name-only --diff-filter=ACMR \
            "origin/${{ github.base_ref }}" HEAD -- '*.md' | tr '\n' ' ')
          if [ -z "$files" ]; then
            echo "No .md files added/modified in this PR — lychee will be skipped."
            echo "any_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changed .md files: $files"
            echo "any_changed=true" >> "$GITHUB_OUTPUT"
            echo "files=$files" >> "$GITHUB_OUTPUT"
          fi

      - name: Run lychee (PR — diff only)
        id: lychee_pr
        if: github.event_name == 'pull_request' && steps.changed.outputs.any_changed == 'true'
        uses: lycheeverse/lychee-action@v2
        env:
          # Lets lychee use the GitHub API for github.com links instead of
          # scraping them, which avoids anonymous rate limiting on a list
          # made almost entirely of github.com URLs.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >-
            --verbose
            --no-progress
            --max-concurrency 4
            ${{ steps.changed.outputs.files }}
          fail: true
          # A PR can legitimately change a .md file that contains no links at
          # all. lychee treats an empty run as a misconfiguration and fails by
          # default, which failed PR #4 on a REJECTIONS.md edit. Only the
          # diff-scoped run can be empty for a good reason, so the relaxation
          # stays here; an empty full-repo sweep below really is a config error.
          failIfEmpty: false

      - name: Run lychee (scheduled / manual — full repo)
        id: lychee_full
        if: github.event_name != 'pull_request'
        uses: lycheeverse/lychee-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >-
            --verbose
            --no-progress
            --max-concurrency 4
            './**/*.md'
          fail: false

      # lychee-action v2 reports its exit code as a step output. It writes
      # nothing to $GITHUB_ENV, so the earlier `env.lychee_exit_code` guard
      # read an undefined value, compared it against '0' as a number, and
      # skipped these steps on every scheduled run including genuine failures.
      - name: Find the standing link-check issue
        id: standing
        if: github.event_name == 'schedule' && steps.lychee_full.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" \
            --label ci --state open --limit 100 \
            --json number,title \
            --jq 'map(select(.title == $ENV.ISSUE_TITLE)) | first | .number // empty')
          if [ -n "$number" ]; then
            echo "Refreshing standing issue #${number}."
          else
            echo "No open standing issue; a new one will be opened."
          fi
          echo "number=${number}" >> "$GITHUB_OUTPUT"

      - name: Open or refresh the issue on scheduled failure
        if: github.event_name == 'schedule' && steps.lychee_full.outputs.exit_code != '0'
        uses: peter-evans/create-issue-from-file@v6
        with:
          # Empty when the lookup found nothing, which makes the action open a
          # fresh issue. Passing it is what stops each weekly run filing a
          # duplicate of the one already open.
          issue-number: ${{ steps.standing.outputs.number }}
          title: ${{ env.ISSUE_TITLE }}
          content-filepath: ./lychee/out.md
          labels: |
            ci
            docs
