name: Maintained check

# Mechanised early-warning for the README's "maintained" bar (roughly twelve
# months, judged by hand at review time). Flags anything quieter than 90
# days so staleness surfaces for review well before an entry actually
# crosses that bar -- see scripts/check_maintained.py for the threshold and
# why it is deliberately not the bar itself.

on:
  schedule:
    - cron: '0 7 * * 1' # Monday 07:00 UTC, an hour after the link check
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    # Scoped to this job only (not the workflow) so no other job in this
    # file inherits write access. contents: write is needed only by the
    # restamp step below; the check step itself only reads.
    permissions:
      contents: write
      issues: write
    env:
      # One title for the standing issue. The lookup below matches on it and
      # create-issue-from-file writes it, so the two must not drift apart.
      ISSUE_TITLE: 'Maintained-bar check: entries to review'
    steps:
      - uses: actions/checkout@v7

      - name: Check each entry's last push date
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/check_maintained.py | tee maintained-report.txt
          if grep -qE "^(STALE|UNREACHABLE)" maintained-report.txt; then
            echo "found_stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "found_stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Find the standing maintained-bar issue
        id: standing
        if: steps.check.outputs.found_stale == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" \
            --label maintenance --state open --limit 100 \
            --json number,title \
            --jq 'map(select(.title == $ENV.ISSUE_TITLE)) | first | .number // empty')
          if [ -n "$number" ]; then
            echo "Refreshing standing issue #${number}."
          else
            echo "No open standing issue; a new one will be opened."
          fi
          echo "number=${number}" >> "$GITHUB_OUTPUT"

      - name: Open or refresh the issue when an entry has gone quiet
        if: steps.check.outputs.found_stale == 'true'
        uses: peter-evans/create-issue-from-file@v6
        with:
          # Empty when the lookup found nothing, which makes the action open a
          # fresh issue. Passing it is what stops each weekly run filing a
          # duplicate of the one already open.
          issue-number: ${{ steps.standing.outputs.number }}
          title: ${{ env.ISSUE_TITLE }}
          content-filepath: ./maintained-report.txt
          labels: |
            maintenance

      - name: Restamp README verified-on date
        # Only when this run found zero breaches -- a stamp written while
        # entries are stale would assert a verification that didn't happen.
        # See the "Open issue" step above: the two are mutually exclusive.
        if: steps.check.outputs.found_stale == 'false'
        run: |
          today="$(date -u +%Y-%m-%d)"
          sed -i -E "s/^All entries verified [0-9]{4}-[0-9]{2}-[0-9]{2}\./All entries verified ${today}./" README.md
          if git diff --quiet -- README.md; then
            echo "README.md already stamped ${today}; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Restamp verified-on date to ${today} [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
