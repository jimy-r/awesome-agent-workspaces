name: Maintained check

# Mechanised watch on the README's "maintained" bar. The check reports two
# markers: STALE at 90 days (early warning, worth a look) and BREACH at 365
# days or UNREACHABLE (the bar itself crossed, judged by hand at review time).
# See scripts/check_maintained.py for why they are separate.
#
# The review issue is filed on either marker. The README restamp fires only
# when nothing has breached, because a healthy curated list always has some
# entries in the 90-day band and gating the restamp on that band meant it
# could never fire at all.

on:
  schedule:
    - cron: '0 7 * * 1' # Monday 07:00 UTC, an hour after the link check
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    # Scoped to this job only (not the workflow) so no other job in this
    # file inherits write access. contents: write is needed only by the
    # restamp step below; the check step itself only reads.
    permissions:
      contents: write
      issues: write
    env:
      # One title for the standing issue. The lookup below matches on it and
      # create-issue-from-file writes it, so the two must not drift apart.
      ISSUE_TITLE: 'Maintained-bar check: entries to review'
    steps:
      - uses: actions/checkout@v7

      - name: Check each entry's last push date
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/check_maintained.py | tee maintained-report.txt
          if grep -qE "^(BREACH|UNREACHABLE)" maintained-report.txt; then
            echo "found_breach=true" >> "$GITHUB_OUTPUT"
          else
            echo "found_breach=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -qE "^STALE" maintained-report.txt; then
            echo "found_stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "found_stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Find the standing maintained-bar issue
        id: standing
        if: steps.check.outputs.found_stale == 'true' || steps.check.outputs.found_breach == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" \
            --label maintenance --state open --limit 100 \
            --json number,title \
            --jq 'map(select(.title == $ENV.ISSUE_TITLE)) | first | .number // empty')
          if [ -n "$number" ]; then
            echo "Refreshing standing issue #${number}."
          else
            echo "No open standing issue; a new one will be opened."
          fi
          echo "number=${number}" >> "$GITHUB_OUTPUT"

      - name: Open or refresh the issue when an entry has gone quiet
        if: steps.check.outputs.found_stale == 'true' || steps.check.outputs.found_breach == 'true'
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6
        with:
          # Empty when the lookup found nothing, which makes the action open a
          # fresh issue. Passing it is what stops each weekly run filing a
          # duplicate of the one already open.
          issue-number: ${{ steps.standing.outputs.number }}
          title: ${{ env.ISSUE_TITLE }}
          content-filepath: ./maintained-report.txt
          labels: |
            maintenance

      - name: Restamp README verified-on date
        # Only when this run found zero breaches. Entries sitting in the
        # 90-day STALE band do not block it; the sentence the stamp writes
        # claims exactly what this check proved, and no more.
        if: steps.check.outputs.found_breach == 'false'
        run: |
          today="$(date -u +%Y-%m-%d)"
          sed -i -E "s|^Every entry checked against the maintained bar [0-9]{4}-[0-9]{2}-[0-9]{2}\.|Every entry checked against the maintained bar ${today}.|" README.md
          if git diff --quiet -- README.md; then
            echo "README.md already stamped ${today}; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Restamp verified-on date to ${today} [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
